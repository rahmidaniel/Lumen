[package]
name = "lumen"
description = "Lumen — one app for every brand's RGB devices, built on OpenRGB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `_lib` keeps the library name distinct from the binary on Windows.
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
lumen-core = { path = "../crates/lumen-core" }
lumen-vendor-razer = { path = "../crates/lumen-vendor-razer" }
lumen-vendor-hyperx = { path = "../crates/lumen-vendor-hyperx" }
lumen-vendor-hid = { path = "../crates/lumen-vendor-hid" }
openrgb-sdk = { path = "../crates/openrgb-sdk" }
hidapi = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
